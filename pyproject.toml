[project]
name = "clip-it-up"
version = "0.1.0"
description = "clip-it-up root workspace"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/shared-py",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
clip-shared = { workspace = true }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",  # line length handled by black/formatter
    "B008",  # FastAPI Depends() in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["clip_shared", "api", "worker"]

[tool.pytest.ini_options]
markers = [
    "heavy: marks tests as heavy FFmpeg / end-to-end (deselect with '-m \"not heavy\"')",
]
