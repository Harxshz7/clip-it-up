[project]
name = "clip-worker"
version = "0.1.0"
description = "Celery worker for clip-it-up video processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "clip-shared",
    "celery>=5.4.0",
    "redis>=5.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
