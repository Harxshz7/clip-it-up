[project]
name = "clip-worker"
version = "0.1.0"
description = "Celery worker for clip-it-up video processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "clip-shared",
    "celery>=5.4.0",
    "redis>=5.0.4",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]
