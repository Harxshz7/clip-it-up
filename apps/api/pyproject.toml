[project]
name = "clip-api"
version = "0.1.0"
description = "FastAPI backend for clip-it-up"
requires-python = ">=3.12"
dependencies = [
    "clip-shared",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.4",
    "boto3>=1.34.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "sentry-sdk>=2.1.1",
    "structlog>=24.1.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
